name: Docker Nginx Test

on:
  push:
    branches:
      - main

jobs:
  nginx:
    runs-on: nginx-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Nginx Container
        run: |
          docker run -d --name nginx-container1 -p 8080:8083 nginx

      - name: Verify Nginx
        run: |
          sleep 5
          curl http://localhost:8083

      - name: Show Containers
        run: |
           docker ps
           docker ps -a
           docker create namespace pkc
